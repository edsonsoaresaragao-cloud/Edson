# Free evaluation deployment. Review the provider's current limits before creating resources.
services:
  - type: web
    name: edson-oficina
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: bash scripts/start-render.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edson-oficina-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: edson-oficina-db
    plan: free
    region: oregon
    databaseName: edson
    user: edson
    ipAllowList: []
